name: E2E emulator suite
description: Free disk, restore emulator cache, install deps, boot AVD, run WDIO suite(s)
inputs:
  suite:
    description: WDIO suite name (smoke, general, gates, …). gates = smoke then general on one boot.
    required: true
runs:
  using: composite
  steps:
    # Skip `docker system prune` — it burned ~3m on the last green run and e2e
    # only needs toolchain dirs cleared for the Android SDK remount.
    - name: Free disk space
      shell: bash
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
          /usr/local/.ghcup 2>/dev/null || true
        sudo rm -rf /usr/local/lib/android
        sudo mkdir -p /usr/local/lib/android
        sudo chown -R "$USER:$USER" /usr/local/lib/android
        df -h
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - uses: actions/setup-node@v5
      with:
        node-version: 20
        cache: npm
        package-manager-cache: false
        cache-dependency-path: e2e/package-lock.json
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: android-actions/setup-android@v4
      with:
        packages: platform-tools emulator
    - name: Resolve SDK root
      id: sdk
      shell: bash
      run: |
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "$SDK" && test -d "$SDK"
        echo "dir=$SDK" >> "$GITHUB_OUTPUT"
        mkdir -p "$SDK/system-images/android-${{ env.EMU_API }}/${{ env.EMU_TARGET }}/${{ env.EMU_ARCH }}"
        df -h
    - name: Emulator cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
          ${{ steps.sdk.outputs.dir }}/system-images/android-${{ env.EMU_API }}/${{ env.EMU_TARGET }}/${{ env.EMU_ARCH }}
        key: emu-${{ runner.os }}-api${{ env.EMU_API }}-${{ env.EMU_TARGET }}-${{ env.EMU_ARCH }}-${{ env.EMU_AVD }}-v5
    - name: Download APK
      uses: actions/download-artifact@v7
      with:
        name: quicknovel-ultimate-apk
        path: e2e/apps
    - name: Install E2E deps
      shell: bash
      working-directory: e2e
      run: |
        npm ci
        npx appium driver install uiautomator2 || npx appium driver update uiautomator2 || true
        test -f apps/QuickNovel-Ultimate.apk
        ls -lh apps/QuickNovel-Ultimate.apk
        df -h
    - name: Run ${{ inputs.suite }} suite
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ env.EMU_API }}
        target: ${{ env.EMU_TARGET }}
        arch: ${{ env.EMU_ARCH }}
        profile: ${{ env.EMU_PROFILE }}
        avd-name: ${{ env.EMU_AVD }}
        force-avd-creation: false
        cores: 2
        ram-size: 2048M
        emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash e2e/scripts/ci-run-suite.sh ${{ inputs.suite }}
    - name: Upload Allure results (${{ inputs.suite }})
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: allure-results-${{ inputs.suite }}
        path: e2e/allure-results
        if-no-files-found: warn
        retention-days: 3
        overwrite: true
    # Single-file Awesome HTML — opens with double-click (no local HTTP server).
    - name: Generate Allure HTML
      if: always()
      shell: bash
      working-directory: e2e
      run: |
        if [ -d allure-results ] && [ "$(ls -A allure-results 2>/dev/null || true)" ]; then
          npx allure awesome ./allure-results --single-file -o ./allure-report
          test -f allure-report/index.html || test -f allure-report/awesome/index.html
          # Flatten if Awesome nests under awesome/
          if [ -f allure-report/awesome/index.html ] && [ ! -f allure-report/index.html ]; then
            mv allure-report/awesome/index.html allure-report/index.html
          fi
        else
          mkdir -p allure-report
          echo "<html><body>No Allure results</body></html>" > allure-report/index.html
        fi
    - name: Upload Allure HTML
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: allure-report
        # Only the self-contained index.html (zip stays small / double-click friendly).
        path: |
          e2e/allure-report/index.html
        if-no-files-found: warn
        retention-days: 3
        overwrite: true
    - name: Upload WDIO logs (${{ inputs.suite }})
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: wdio-logs-${{ inputs.suite }}
        path: |
          e2e/*.log
          e2e/appium-ci.log
          e2e/allure-results
        if-no-files-found: ignore
        retention-days: 3
        overwrite: true
