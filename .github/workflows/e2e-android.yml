name: CI Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel only on PRs. Push cancel mid "Terminate Emulator" marked smoke as
  # failed even when WDIO already reported 5 passing (operation canceled).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant Gradle execute
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

  build-apk:
    name: Build & sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Grant Gradle execute
        run: chmod +x gradlew
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Sign APK (debug keystore for CI)
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          UNSIGNED=app/build/outputs/apk/release/app-universal-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED=$(ls app/build/outputs/apk/release/*-universal-*.apk | head -n1)
          fi
          KEYSTORE=$HOME/.android/debug.keystore
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p e2e/apps
          OUT=e2e/apps/QuickNovel-Ultimate.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey --out "$OUT" "$UNSIGNED"
          ls -lh "$OUT"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: quicknovel-ultimate-apk
          path: e2e/apps/QuickNovel-Ultimate.apk
          retention-days: 7

  e2e:
    name: E2E ${{ matrix.suite }}
    needs: build-apk
    # ubuntu-latest → 26.04 breaks WDIO worker IPC via xvfb-run (#15685)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.soft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            timeout: 60
            soft: false
          - suite: features
            timeout: 60
            soft: false
          - suite: reader
            timeout: 60
            soft: false
          - suite: providers
            timeout: 75
            soft: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools emulator
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: quicknovel-ultimate-apk
          path: e2e/apps
      - name: Install E2E deps
        working-directory: e2e
        run: |
          npm ci
          npx appium driver install uiautomator2 || npx appium driver update uiautomator2 || true
          test -f apps/QuickNovel-Ultimate.apk
          ls -lh apps/QuickNovel-Ultimate.apk
      - name: Run ${{ matrix.suite }} suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # emulator-runner runs EACH script line in a fresh /bin/sh — use one bash file
          script: bash e2e/scripts/ci-run-suite.sh ${{ matrix.suite }}
      - name: Upload Allure results (${{ matrix.suite }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          path: e2e/allure-results
          if-no-files-found: warn
          retention-days: 14
      - name: Upload WDIO logs (${{ matrix.suite }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs-${{ matrix.suite }}
          path: |
            e2e/*.log
            e2e/appium-ci.log
            e2e/allure-results
          if-no-files-found: ignore

  allure-report:
    name: Merge Allure report
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install deps
        working-directory: e2e
        run: npm ci --omit=optional
      - name: Download all Allure result shards
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: e2e/allure-shards
          merge-multiple: false
      - name: Merge results
        working-directory: e2e
        run: |
          mkdir -p allure-results
          if [ -d allure-shards ]; then
            find allure-shards -type f -exec cp {} allure-results/ \;
          fi
          ls -la allure-results || true
          if [ -d allure-results ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            npx allure generate ./allure-results --clean -o ./allure-report
          else
            echo "No allure results to merge"
            mkdir -p allure-report
            echo "<html><body>No Allure results</body></html>" > allure-report/index.html
          fi
      - name: Upload merged Allure HTML
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: e2e/allure-report
          if-no-files-found: warn
          retention-days: 14
