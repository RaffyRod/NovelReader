name: CI Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel only on PRs. Push cancel mid "Terminate Emulator" marked smoke as
  # failed even when WDIO already reported 5 passing (operation canceled).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Shared emulator profile — keep in sync across prepare-emulator + e2e jobs.
  # Pipeline: unit ∥ build → e2e gates (smoke then general, one AVD boot).
  # prepare-emulator warms AVD cache in parallel (does not gate e2e).
  EMU_API: 30
  EMU_TARGET: google_apis
  EMU_ARCH: x86_64
  EMU_PROFILE: pixel_4
  EMU_AVD: qn_ci_api30_gapis

jobs:
  cleanup-artifacts:
    name: Prune old artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete previous CI artifacts
        uses: actions/github-script@v7
        with:
          script: |
            let deleted = 0;
            let bytes = 0;
            let page = 1;
            for (;;) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              if (!data.artifacts.length) break;
              for (const a of data.artifacts) {
                if (a.workflow_run && a.workflow_run.id === context.runId) continue;
                core.info(
                  `Deleting ${a.name} (#${a.id}, ${(a.size_in_bytes / 1048576).toFixed(1)} MB)` +
                    ` from run ${a.workflow_run?.id ?? '?'}`
                );
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
                deleted++;
                bytes += a.size_in_bytes || 0;
              }
              if (data.artifacts.length < 100) break;
              page++;
            }
            core.info(
              `Deleted ${deleted} artifact(s), ~${(bytes / 1048576).toFixed(1)} MB freed`
            );

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [cleanup-artifacts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant Gradle execute
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 3
          overwrite: true

  # Parallel with unit — green path saves unit wall time on the critical path.
  # E2E still requires both unit + APK success.
  build-apk:
    name: Build & sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [cleanup-artifacts]
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          # No docker prune — slow and not needed for Gradle assemble.
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Grant Gradle execute
        run: chmod +x gradlew
      - name: Assemble x86_64 release
        run: ./gradlew :app:assembleRelease --no-daemon -PabiFilter=x86_64
      - name: Sign APK (debug keystore for CI)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" && test -d "$SDK"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n1)
          test -n "$BUILD_TOOLS"
          UNSIGNED=app/build/outputs/apk/release/app-x86_64-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            echo "Expected unsigned APK missing; listing outputs:"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          KEYSTORE=$HOME/.android/debug.keystore
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p e2e/apps
          OUT=e2e/apps/QuickNovel-Ultimate.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey --out "$OUT" "$UNSIGNED"
          ls -lh "$OUT"
          test -s "$OUT"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: quicknovel-ultimate-apk
          path: e2e/apps/QuickNovel-Ultimate.apk
          retention-days: 3
          overwrite: true
          if-no-files-found: error

  # Cache warmer only — e2e restores the same cache key itself.
  prepare-emulator:
    name: Prepare emulator cache
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    continue-on-error: true
    needs: [cleanup-artifacts]
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER:$USER" /usr/local/lib/android
          df -h
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools emulator
      - name: Resolve SDK root
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -n "$SDK"
          test -d "$SDK"
          echo "dir=$SDK" >> "$GITHUB_OUTPUT"
          mkdir -p "$SDK/system-images/android-${{ env.EMU_API }}/${{ env.EMU_TARGET }}/${{ env.EMU_ARCH }}"
          df -h
      - name: Emulator cache
        uses: actions/cache@v4
        id: emu-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ${{ steps.sdk.outputs.dir }}/system-images/android-${{ env.EMU_API }}/${{ env.EMU_TARGET }}/${{ env.EMU_ARCH }}
          key: emu-${{ runner.os }}-api${{ env.EMU_API }}-${{ env.EMU_TARGET }}-${{ env.EMU_ARCH }}-${{ env.EMU_AVD }}-v5
      - name: Accept SDK licenses
        if: steps.emu-cache.outputs.cache-hit != 'true'
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Seed AVD + system image
        if: steps.emu-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMU_API }}
          target: ${{ env.EMU_TARGET }}
          arch: ${{ env.EMU_ARCH }}
          profile: ${{ env.EMU_PROFILE }}
          avd-name: ${{ env.EMU_AVD }}
          force-avd-creation: false
          cores: 2
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD + system image ready for cache"

  e2e:
    name: E2E gates
    # Do not wait on prepare-emulator — cache restore is inside the action.
    needs: [unit, build-apk]
    if: always() && needs.unit.result == 'success' && needs.build-apk.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke then general
        uses: ./.github/actions/e2e-emulator-suite
        with:
          suite: gates
