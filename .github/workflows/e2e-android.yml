name: E2E Android (WebdriverIO)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Build APK + Appium + Allure
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Grant Gradle execute
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign APK (debug keystore for CI)
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          UNSIGNED=app/build/outputs/apk/release/app-universal-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED=$(ls app/build/outputs/apk/release/*-universal-*.apk | head -n1)
          fi
          KEYSTORE=$HOME/.android/debug.keystore
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          OUT=e2e/apps/QuickNovel-Ultimate.apk
          mkdir -p e2e/apps
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey --out "$OUT" "$UNSIGNED"
          ls -lh "$OUT"

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx appium driver install uiautomator2 || npx appium driver update uiautomator2 || true

      - name: Run WebdriverIO on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            cd e2e
            export APP_PATH="$GITHUB_WORKSPACE/e2e/apps/QuickNovel-Ultimate.apk"
            export CI=true
            export WDIO_LOG_LEVEL=warn
            npm test

      - name: Generate Allure HTML report
        if: always()
        working-directory: e2e
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            npx allure generate ./allure-results --clean -o ./allure-report
          else
            echo "No allure-results to generate"
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: e2e/allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: e2e/allure-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload WDIO logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs
          path: |
            e2e/*.log
            e2e/allure-results
          if-no-files-found: ignore
