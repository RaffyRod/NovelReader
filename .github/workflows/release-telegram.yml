# Build signed universal APK and post it to the private Telegram channel.
# Secrets required: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Optional (recommended later): KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release → Telegram

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional extra note (appended under changelog)'
        required: false
        default: ''

concurrency:
  group: release-telegram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & send APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for “since previous tag” fallback changelog.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Grant Gradle execute
        run: chmod +x gradlew

      - name: Read versionName / versionCode
        id: ver
        run: |
          NAME=$(grep -E '^\s*versionName\s+"' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CODE=$(grep -E '^\s*versionCode\s+' app/build.gradle | head -1 | sed -E 's/[^0-9]//g')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - name: Build changelog
        id: notes
        env:
          VER_NAME: ${{ steps.ver.outputs.name }}
          NOTE: ${{ github.event.inputs.note || '' }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, subprocess, pathlib

          ver = os.environ["VER_NAME"].strip()
          note = os.environ.get("NOTE", "").strip()
          out = pathlib.Path("dist")
          out.mkdir(parents=True, exist_ok=True)

          def section_from_changelog(text: str, version: str) -> str:
              # ## 2.0.0 ... until next ## 
              pat = re.compile(
                  rf"^##\s+{re.escape(version)}\s*\n(.*?)(?=^##\s+|\Z)",
                  re.M | re.S,
              )
              m = pat.search(text)
              if not m:
                  return ""
              body = m.group(1).strip()
              # Keep it readable for Telegram (drop empty lines excess)
              lines = [ln.rstrip() for ln in body.splitlines()]
              while lines and not lines[0].strip():
                  lines.pop(0)
              while lines and not lines[-1].strip():
                  lines.pop()
              return "\n".join(lines).strip()

          changelog = ""
          path = pathlib.Path("CHANGELOG.md")
          if path.is_file():
              changelog = section_from_changelog(path.read_text(encoding="utf-8"), ver)

          if not changelog:
              # Fallback: commits since previous version tag (vX.Y.Z) or last 12 commits
              prev = ""
              try:
                  tags = subprocess.check_output(
                      ["git", "tag", "-l", "v*", "--sort=-v:refname"],
                      text=True,
                  ).splitlines()
                  # Skip current tag if we are on it
                  current_refs = {f"v{ver}", ver}
                  tags = [t for t in tags if t not in current_refs]
                  prev = tags[0] if tags else ""
              except Exception:
                  prev = ""
              if prev:
                  log = subprocess.check_output(
                      ["git", "log", f"{prev}..HEAD", "--pretty=format:- %s"],
                      text=True,
                  )
              else:
                  log = subprocess.check_output(
                      ["git", "log", "-12", "--pretty=format:- %s"],
                      text=True,
                  )
              # Prefer feat/fix lines; keep order
              lines = [ln for ln in log.splitlines() if ln.strip()]
              prefer = [ln for ln in lines if re.search(r"\b(feat|fix|docs|ci)\b", ln, re.I)]
              pick = prefer[:12] if prefer else lines[:12]
              changelog = "\n".join(pick) if pick else "- Maintenance release"

          parts = ["What's new", "", changelog]
          if note:
              parts.extend(["", note])
          text = "\n".join(parts).strip() + "\n"
          (out / "changelog.txt").write_text(text, encoding="utf-8")
          print(text)
          PY

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign universal APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          UNSIGNED=app/build/outputs/apk/release/app-universal-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED=$(ls app/build/outputs/apk/release/*universal*unsigned*.apk 2>/dev/null | head -n1 || true)
          fi
          test -f "$UNSIGNED"
          OUT="QuickNovel-Ultimate-${{ steps.ver.outputs.name }}-universal.apk"
          mkdir -p dist

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Using release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            "$BUILD_TOOLS/apksigner" sign \
              --ks /tmp/release.jks \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out "dist/$OUT" \
              "$UNSIGNED"
            rm -f /tmp/release.jks
            echo "signer=release" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_* secrets — signing with Android debug keystore (CI)"
            KEYSTORE=$HOME/.android/debug.keystore
            mkdir -p "$HOME/.android"
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
                -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias androiddebugkey \
              --out "dist/$OUT" \
              "$UNSIGNED"
            echo "signer=debug" >> "$GITHUB_OUTPUT"
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose "dist/$OUT"
          ls -lh "dist/$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickNovel-Ultimate-${{ steps.ver.outputs.name }}
          path: dist/${{ steps.sign.outputs.apk }}
          retention-days: 30

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK: dist/${{ steps.sign.outputs.apk }}
          APP_NAME: QuickNovel Ultimate
          VER_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_ID:-}"
          test -f "$APK"
          test -f dist/changelog.txt

          # UTC release date, e.g. November 2, 2026
          export RELEASE_DATE
          RELEASE_DATE=$(date -u +"%B %-d, %Y" 2>/dev/null || date -u +"%B %d, %Y" | sed 's/ 0/ /')

          python3 <<'PY'
          import json, os, subprocess, sys, urllib.parse, urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          apk = os.environ["APK"]
          app = os.environ["APP_NAME"]
          ver = os.environ["VER_NAME"]
          release_date = os.environ["RELEASE_DATE"]
          changelog = open("dist/changelog.txt", encoding="utf-8").read().strip()

          header = (
              f"Hey, here's a new version of {app}.\n\n"
              f"Version: {ver}\n"
              f"Release date: {release_date}"
          )
          # Prefer one caption with changelog; Telegram document caption max = 1024.
          combined = header + "\n\n" + changelog
          CAPTION_MAX = 1024
          MSG_MAX = 4096

          def api_ok(path: str) -> dict:
              data = json.load(open(path, encoding="utf-8"))
              if not data.get("ok"):
                  print(data, file=sys.stderr)
                  sys.exit(1)
              return data

          if len(combined) <= CAPTION_MAX:
              caption = combined
              follow_up = None
          else:
              caption = header + "\n\n(See next message for What's new.)"
              follow_up = changelog if len(changelog) <= MSG_MAX else changelog[: MSG_MAX - 20] + "\n…"

          cmd = [
              "curl", "-sS", "-X", "POST",
              f"https://api.telegram.org/bot{token}/sendDocument",
              "-F", f"chat_id={chat_id}",
              "-F", f"document=@{apk}",
              "-F", f"caption={caption}",
              "-F", "disable_notification=false",
          ]
          with open("/tmp/tg-doc.json", "w", encoding="utf-8") as f:
              subprocess.run(cmd, check=True, stdout=f)
          doc = api_ok("/tmp/tg-doc.json")
          print("Telegram document ok: message_id=", doc.get("result", {}).get("message_id"))

          if follow_up:
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": follow_up,
                      "disable_web_page_preview": "true",
                  }
              ).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read().decode()
              open("/tmp/tg-msg.json", "w", encoding="utf-8").write(raw)
              msg = api_ok("/tmp/tg-msg.json")
              print("Telegram changelog ok: message_id=", msg.get("result", {}).get("message_id"))
          PY
