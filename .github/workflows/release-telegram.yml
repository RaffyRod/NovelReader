# Manual only: auto-bump Ultimate 2.x, build signed universal APK, post to Telegram.
# Skips if there are no new commits since the last Ultimate release tag (v2.*).
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Optional: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release → Telegram

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional extra note (appended under changelog)'
        required: false
        default: ''
      force:
        description: 'Release even with no new commits (still bumps patch)'
        type: boolean
        required: false
        default: false
      bump:
        description: 'Version bump kind'
        type: choice
        options: [patch, minor, major]
        required: false
        default: patch

concurrency:
  group: release-telegram-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, build & send APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Push bump commit + tag back to the branch that triggered the run.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require green CI Android (e2e) on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Telegram APK must not ship if the latest CI Android on main failed
          # (includes smoke / features* / reader / providers e2e).
          ROW=$(gh run list --repo "${{ github.repository }}" \
            --workflow "CI Android" --branch main --limit 1 \
            --json conclusion,status,headSha,displayTitle,url \
            --jq '.[0] // empty')
          if [ -z "$ROW" ]; then
            echo "::error::No CI Android runs found on main. Push first and wait for green e2e."
            exit 1
          fi
          echo "$ROW" | tee /tmp/ci-android-latest.json
          CONCLUSION=$(echo "$ROW" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or '')")
          STATUS=$(echo "$ROW" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status') or '')")
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Latest CI Android on main is status=$STATUS conclusion=$CONCLUSION — fix e2e before releasing."
            exit 1
          fi
          echo "CI Android green — proceeding with release."

      - name: Gate — new commits since last Ultimate release
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail

          CURRENT_NAME=$(grep -E '^\s*versionName\s+"' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CURRENT_CODE=$(grep -E '^\s*versionCode\s+' app/build.gradle | head -1 | sed -E 's/[^0-9]//g')
          echo "current_name=$CURRENT_NAME" >> "$GITHUB_OUTPUT"
          echo "current_code=$CURRENT_CODE" >> "$GITHUB_OUTPUT"

          # Ultimate line only — ignore upstream QuickNovel v3.* tags.
          LAST_TAG=$(git tag -l 'v2.*' --sort=-v:refname | head -n1 || true)
          echo "last_tag=${LAST_TAG:-}" >> "$GITHUB_OUTPUT"

          if [ -z "${LAST_TAG:-}" ]; then
            echo "No Ultimate release tag (v2.*) yet — tagging baseline v${CURRENT_NAME} at HEAD (no APK)."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${CURRENT_NAME}" -m "Baseline Ultimate ${CURRENT_NAME}"
            git push origin "v${CURRENT_NAME}"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=baseline_tag_created" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commits since last Ultimate tag (exclude prior auto-release bumps).
          mapfile -t SUBJECTS < <(
            git log "${LAST_TAG}..HEAD" --pretty=format:%s --no-merges \
              | grep -v -E '^chore\(release\):' || true
          )
          COUNT=${#SUBJECTS[@]}
          echo "new_commits=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Commits since ${LAST_TAG}: ${COUNT}"

          if [ "$COUNT" -eq 0 ] && [ "${FORCE}" != "true" ]; then
            echo "No new commits since ${LAST_TAG} — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_new_commits" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "reason=ok" >> "$GITHUB_OUTPUT"
          {
            echo "subjects<<EOF"
            printf '%s\n' "${SUBJECTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.gate.outputs.should_release != 'true'
        run: |
          echo "::notice::Release skipped (${{ steps.gate.outputs.reason }}). last_tag=${{ steps.gate.outputs.last_tag || 'none' }}"

      - name: Bump version + CHANGELOG
        if: steps.gate.outputs.should_release == 'true'
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          CURRENT_NAME: ${{ steps.gate.outputs.current_name }}
          CURRENT_CODE: ${{ steps.gate.outputs.current_code }}
          LAST_TAG: ${{ steps.gate.outputs.last_tag }}
          SUBJECTS: ${{ steps.gate.outputs.subjects }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, pathlib, re

          name = os.environ["CURRENT_NAME"].strip()
          code = int(os.environ["CURRENT_CODE"])
          bump = os.environ.get("BUMP", "patch").strip().lower()
          subjects = [s.strip() for s in os.environ.get("SUBJECTS", "").splitlines() if s.strip()]

          maj, min_, pat = (int(x) for x in name.split("."))
          if bump == "major":
              maj, min_, pat = maj + 1, 0, 0
          elif bump == "minor":
              min_, pat = min_ + 1, 0
          else:
              pat += 1
          new_name = f"{maj}.{min_}.{pat}"
          new_code = code + 1

          gradle = pathlib.Path("app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          text, n1 = re.subn(
              r'(^\s*versionCode\s+)\d+',
              rf"\g<1>{new_code}",
              text,
              count=1,
              flags=re.M,
          )
          text, n2 = re.subn(
              r'(^\s*versionName\s+")[^"]+(")',
              rf"\g<1>{new_name}\2",
              text,
              count=1,
              flags=re.M,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Failed to patch build.gradle (code={n1}, name={n2})")
          gradle.write_text(text, encoding="utf-8")

          added, fixed = [], []
          for s in subjects:
              clean = re.sub(r"^(feat|fix|docs|ci|chore|refactor|test|perf)(\(.+?\))?:\s*", "", s, flags=re.I)
              line = f"- {clean}"
              if re.match(r"fix\b", s, re.I):
                  fixed.append(line)
              else:
                  added.append(line)
          if not added and not fixed:
              added = ["- Maintenance release"]

          # Cap CHANGELOG length; Telegram caption has its own limit later.
          added, fixed = added[:12], fixed[:12]
          block = [f"## {new_name}", ""]
          if added:
              block += ["### Added", *added, ""]
          if fixed:
              block += ["### Fixed", *fixed, ""]
          block.append(f"### Notes\n- versionCode {new_code}\n")
          section = "\n".join(block) + "\n"

          cl = pathlib.Path("CHANGELOG.md")
          if cl.is_file():
              body = cl.read_text(encoding="utf-8")
              # Insert after the title block (before first ## version section).
              m = re.search(r"^##\s+", body, re.M)
              if m:
                  body = body[: m.start()] + section + body[m.start() :]
              else:
                  body = body.rstrip() + "\n\n" + section
              cl.write_text(body, encoding="utf-8")
          else:
              cl.write_text(
                  "# Changelog\n\n" + section,
                  encoding="utf-8",
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"name={new_name}\n")
              out.write(f"code={new_code}\n")
          print(f"Bumped {name} ({code}) → {new_name} ({new_code})")
          PY

      - name: Commit release bump + tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          NEW_NAME: ${{ steps.bump.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle CHANGELOG.md
          git commit -m "chore(release): v${NEW_NAME} [skip ci]"
          git tag -a "v${NEW_NAME}" -m "QuickNovel Ultimate ${NEW_NAME}"
          # Push branch tip + new tag (and only that tag).
          git push origin HEAD
          git push origin "v${NEW_NAME}"

      - uses: actions/setup-java@v5
        if: steps.gate.outputs.should_release == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4
        if: steps.gate.outputs.should_release == 'true'
        with:
          packages: platform-tools

      - name: Grant Gradle execute
        if: steps.gate.outputs.should_release == 'true'
        run: chmod +x gradlew

      - name: Build changelog caption (style D)
        if: steps.gate.outputs.should_release == 'true'
        id: notes
        env:
          VER_NAME: ${{ steps.bump.outputs.name }}
          NOTE: ${{ github.event.inputs.note || '' }}
          APP_NAME: QuickNovel Ultimate
        run: |
          set -euo pipefail
          RELEASE_DATE=$(date -u +"%b %-d, %Y" 2>/dev/null || date -u +"%b %d, %Y" | sed 's/ 0/ /')
          export RELEASE_DATE
          python3 <<'PY'
          import os, re, pathlib

          ver = os.environ["VER_NAME"].strip()
          note = os.environ.get("NOTE", "").strip()
          app = os.environ.get("APP_NAME", "QuickNovel Ultimate").strip()
          release_date = os.environ["RELEASE_DATE"].strip()
          out = pathlib.Path("dist")
          out.mkdir(parents=True, exist_ok=True)

          def version_body(text: str, version: str) -> str:
              pat = re.compile(
                  rf"^##\s+{re.escape(version)}\s*\n(.*?)(?=^##\s+|\Z)",
                  re.M | re.S,
              )
              m = pat.search(text)
              return m.group(1).strip() if m else ""

          def bullets_under(body: str, heading: str) -> list[str]:
              pat = re.compile(
                  rf"^###\s+{re.escape(heading)}\s*\n(.*?)(?=^###\s+|\Z)",
                  re.M | re.S,
              )
              m = pat.search(body)
              if not m:
                  return []
              items = []
              for ln in m.group(1).splitlines():
                  s = ln.strip()
                  if s.startswith("- "):
                      items.append("• " + s[2:].strip())
                  elif s.startswith("* "):
                      items.append("• " + s[2:].strip())
              return items

          added, fixed = [], []
          path = pathlib.Path("CHANGELOG.md")
          if path.is_file():
              body = version_body(path.read_text(encoding="utf-8"), ver)
              if body:
                  added = bullets_under(body, "Added")
                  fixed = bullets_under(body, "Fixed")

          if not added and not fixed:
              added = ["• Maintenance release"]

          parts = [
              f"Hey, here's a new version of {app}.",
              "",
              f"📦 Version {ver} · {release_date}",
          ]
          if added:
              parts.extend(["", "✨ Added", *added])
          if fixed:
              parts.extend(["", "🛠 Fixed", *fixed])
          if note:
              parts.extend(["", note])
          text = "\n".join(parts).strip() + "\n"
          (out / "changelog.txt").write_text(text, encoding="utf-8")
          print(text)
          PY

      - name: Assemble release
        if: steps.gate.outputs.should_release == 'true'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign universal APK
        if: steps.gate.outputs.should_release == 'true'
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VER_NAME: ${{ steps.bump.outputs.name }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          UNSIGNED=app/build/outputs/apk/release/app-universal-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED=$(ls app/build/outputs/apk/release/*universal*unsigned*.apk 2>/dev/null | head -n1 || true)
          fi
          test -f "$UNSIGNED"
          OUT="QuickNovel-Ultimate-${VER_NAME}-universal.apk"
          mkdir -p dist

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Using release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            "$BUILD_TOOLS/apksigner" sign \
              --ks /tmp/release.jks \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out "dist/$OUT" \
              "$UNSIGNED"
            rm -f /tmp/release.jks
            echo "signer=release" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_* secrets — signing with Android debug keystore (CI)"
            KEYSTORE=$HOME/.android/debug.keystore
            mkdir -p "$HOME/.android"
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
                -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias androiddebugkey \
              --out "dist/$OUT" \
              "$UNSIGNED"
            echo "signer=debug" >> "$GITHUB_OUTPUT"
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose "dist/$OUT"
          ls -lh "dist/$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: QuickNovel-Ultimate-${{ steps.bump.outputs.name }}
          path: dist/${{ steps.sign.outputs.apk }}
          # Short retention — CI cleanup also wipes prior release APKs on each Android run.
          retention-days: 3
          overwrite: true

      - name: Send APK to Telegram
        if: steps.gate.outputs.should_release == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK: dist/${{ steps.sign.outputs.apk }}
          VER_NAME: ${{ steps.bump.outputs.name }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_ID:-}"
          test -f "$APK"
          test -f dist/changelog.txt

          python3 <<'PY'
          import json, os, subprocess, sys, urllib.parse, urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          apk = os.environ["APK"]
          full = open("dist/changelog.txt", encoding="utf-8").read().strip()
          CAPTION_MAX = 1024
          MSG_MAX = 4096

          def api_ok(path: str) -> dict:
              data = json.load(open(path, encoding="utf-8"))
              if not data.get("ok"):
                  print(data, file=sys.stderr)
                  sys.exit(1)
              return data

          if len(full) <= CAPTION_MAX:
              caption = full
              follow_up = None
          else:
              lines = full.splitlines()
              header = "\n".join(lines[:4]).strip()
              caption = header + "\n\n(See next message for What's new.)"
              follow_up = full if len(full) <= MSG_MAX else full[: MSG_MAX - 20] + "\n…"

          cmd = [
              "curl", "-sS", "-X", "POST",
              f"https://api.telegram.org/bot{token}/sendDocument",
              "-F", f"chat_id={chat_id}",
              "-F", f"document=@{apk}",
              "-F", f"caption={caption}",
              "-F", "disable_notification=false",
          ]
          with open("/tmp/tg-doc.json", "w", encoding="utf-8") as f:
              subprocess.run(cmd, check=True, stdout=f)
          doc = api_ok("/tmp/tg-doc.json")
          print("Telegram document ok: message_id=", doc.get("result", {}).get("message_id"))

          if follow_up:
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": follow_up,
                      "disable_web_page_preview": "true",
                  }
              ).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read().decode()
              open("/tmp/tg-msg.json", "w", encoding="utf-8").write(raw)
              msg = api_ok("/tmp/tg-msg.json")
              print("Telegram changelog ok: message_id=", msg.get("result", {}).get("message_id"))
          PY
